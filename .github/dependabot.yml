version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group updates for better PR management
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # Versioning strategy: increase for patch/minor, create separate PRs for major
    versioning-strategy: increase
    # Ignore major version updates for @types/node to avoid breaking changes
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7.0 ships no compiler API, so typescript-eslint (used by eslint-config-next)
      # refuses to load and `npm run lint` crashes. Stay on 6.0 until typescript-eslint supports 7:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "automated"
      - "github-actions"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"

